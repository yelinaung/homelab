---
# Semaphore UI with SQLite. Listens on loopback only; Caddy serves it on 443.
# Secrets (admin password, access key encryption key) come from
# semaphore.env, which install_semaphore.yaml generates once on the host.
services:
  semaphore:
    # yamllint disable-line rule:line-length
    image: semaphoreui/semaphore:v2.20.24@sha256:c547d31cba238bee4a9f2b5eec9d0f42b2d5ecb399377a2e63008500d74fbf3a
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    # Docker sets ndots:0, so musl never tries the search domains and short
    # inventory names (grafana, immich) fail to resolve.
    dns_opt:
      - ndots:1
    env_file:
      - semaphore.env
    environment:
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_DB_PATH: /var/lib/semaphore
      SEMAPHORE_PLAYBOOK_PATH: /tmp/semaphore/
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_NAME: admin
      SEMAPHORE_ADMIN_EMAIL: admin@localhost
      SEMAPHORE_WEB_ROOT: https://semaphore.bengal-python.ts.net
      SEMAPHORE_SCHEDULE_TIMEZONE: Asia/Singapore
      TZ: Asia/Singapore
    volumes:
      - semaphore-data:/var/lib/semaphore
      - semaphore-config:/etc/semaphore
      # Host keys for the inventory, read by ssh whatever HOME Semaphore sets.
      - ./known_hosts:/etc/ssh/ssh_known_hosts:ro

volumes:
  semaphore-data:
  semaphore-config:
