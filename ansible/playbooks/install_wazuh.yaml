---
# Single-node Wazuh (manager + indexer + dashboard) via the official
# installation assistant. Run against the wazuh VM only:
#   PLAYBOOK=install_wazuh INVENTORY=linux_hosts VM_HOSTS=wazuh mise run playbook
#
# Passwords are generated by the assistant and kept in
# /root/wazuh/wazuh-install-files.tar (wazuh-passwords.txt inside).
- name: Install Wazuh single-node
  hosts: '{{ vm_hosts | default("wazuh") }}'
  become: true
  gather_facts: true
  vars:
    # Download path on packages.wazuh.com; the script pins the patch release.
    wazuh_release: "4.14"
    wazuh_install_dir: /root/wazuh
  tasks:
    - name: Create Wazuh install directory
      ansible.builtin.file:
        path: "{{ wazuh_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Download Wazuh installation assistant
      ansible.builtin.get_url:
        url: "https://packages.wazuh.com/{{ wazuh_release }}/wazuh-install.sh"
        dest: "{{ wazuh_install_dir }}/wazuh-install.sh"
        mode: "0700"

    # The dashboard is installed last, so its presence means a finished run.
    # Never rerun -a over an install: it deletes the existing
    # wazuh-install-files.tar, which holds the only copy of the passwords.
    - name: Run Wazuh all-in-one installation
      ansible.builtin.command:
        cmd: bash ./wazuh-install.sh -a
        chdir: "{{ wazuh_install_dir }}"
        creates: /usr/share/wazuh-dashboard/bin/opensearch-dashboards
      async: 3600
      poll: 30

    # Wazuh recommends this so routine apt upgrades (apt_update_upgrade.yaml)
    # can't upgrade the components out of step with each other.
    - name: Disable Wazuh apt repository
      ansible.builtin.replace:
        path: /etc/apt/sources.list.d/wazuh.list
        regexp: '^deb '
        replace: '#deb '

    # Defaults keep the assistant's 0.0.0.0:443. host_vars can move it to
    # loopback so Caddy can serve 443 with a Tailscale cert (see wazuh.yaml).
    - name: Set Wazuh dashboard listen address
      ansible.builtin.lineinfile:
        path: /etc/wazuh-dashboard/opensearch_dashboards.yml
        regexp: "^{{ item.key }}:"
        line: "{{ item.key }}: {{ item.value }}"
      loop:
        - { key: server.host, value: "{{ wazuh_dashboard_host | default('0.0.0.0') }}" }
        - { key: server.port, value: "{{ wazuh_dashboard_port | default(443) }}" }
      notify: Restart wazuh-dashboard

    - name: Ensure Wazuh services are running
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - wazuh-indexer
        - wazuh-manager
        - filebeat
        - wazuh-dashboard

    - name: Show where the credentials are
      ansible.builtin.debug:
        msg: >-
          Dashboard user is admin. Passwords: sudo tar -O -xf
          {{ wazuh_install_dir }}/wazuh-install-files.tar
          wazuh-install-files/wazuh-passwords.txt

  handlers:
    - name: Restart wazuh-dashboard
      ansible.builtin.systemd:
        name: wazuh-dashboard
        state: restarted
