---
# Install and configure Caddy web server
#
# Usage: PLAYBOOK=install_caddy INVENTORY=linux_hosts VM_HOSTS=<host> mise run playbook
#
# Per-host config: set caddy_caddyfile in inventory/host_vars/<host>.yaml.
#
# Custom config: add -e 'caddy_caddyfile="your_config_here"'
#
# Example configurations:
#
# File server:
#   caddy_caddyfile: |
#     :80 {
#       root * /var/www/html
#       file_server
#     }
#
# Reverse proxy:
#   caddy_caddyfile: |
#     your-domain.com {
#       reverse_proxy localhost:3000
#     }
#
# Multiple sites:
#   caddy_caddyfile: |
#     site1.example.com {
#       root * /var/www/site1
#       file_server
#     }
#     site2.example.com {
#       reverse_proxy localhost:8080
#     }
- name: Install and configure Caddy
  hosts: '{{ vm_hosts | default("all")}}'
  become: true
  gather_facts: true
  vars:
    # Used when caddy_caddyfile isn't set in host_vars/group_vars or extra vars.
    # (A play var named caddy_caddyfile would outrank host_vars.)
    caddy_default_caddyfile: |
      # Basic file server example
      :80 {
        respond "Hello from Caddy on {{ ansible_hostname }}!"
      }
  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - curl
        state: present
        update_cache: true

    - name: Download Caddy GPG key
      ansible.builtin.get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        dest: /tmp/caddy.key
        mode: "0644"

    - name: Add Caddy GPG key to keyring
      ansible.builtin.shell: |
        set -o pipefail
        gpg --dearmor < /tmp/caddy.key > /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        chmod 644 /usr/share/keyrings/caddy-stable-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        executable: /bin/bash

    - name: Download Caddy repository configuration
      ansible.builtin.get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt
        dest: /etc/apt/sources.list.d/caddy-stable.list
        mode: "0644"

    - name: Update package cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Caddy
      ansible.builtin.apt:
        name: caddy
        state: present

    - name: Create Caddyfile
      ansible.builtin.copy:
        content: "{{ caddy_caddyfile | default(caddy_default_caddyfile) }}"
        dest: /etc/caddy/Caddyfile
        owner: root
        group: root
        mode: "0644"
      notify: Restart caddy

    - name: Check for tailscaled defaults file
      ansible.builtin.stat:
        path: /etc/default/tailscaled
      register: caddy_tailscaled_defaults

    # Caddy fetches *.ts.net certs from the local tailscaled, which only serves
    # them to root unless the caddy user is permitted.
    # https://tailscale.com/kb/1190/caddy-certificates
    - name: Let Caddy fetch Tailscale certificates
      ansible.builtin.lineinfile:
        path: /etc/default/tailscaled
        regexp: ^TS_PERMIT_CERT_UID=
        line: TS_PERMIT_CERT_UID=caddy
      when: caddy_tailscaled_defaults.stat.exists
      notify: Restart tailscaled

    - name: Start and enable Caddy service
      ansible.builtin.systemd:
        name: caddy
        state: started
        enabled: true

  handlers:
    # Listed first so tailscaled is permitting the caddy user before Caddy
    # restarts and requests its certificate.
    - name: Restart tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        state: restarted

    - name: Restart caddy
      ansible.builtin.systemd:
        name: caddy
        state: restarted
