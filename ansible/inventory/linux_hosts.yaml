all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
  children:
    lxc_containers:
      hosts:
        beszel-hub:
          ansible_user: root
        forgejo:
          ansible_user: root
          compose_dirs:
            - "/root"
        unpoller:
          ansible_user: root
          compose_dirs:
            - "/root"
        readeck:
          ansible_user: root
          compose_dirs:
            - "/root"
        miniflux:
          ansible_user: root
          compose_dirs:
            - "/root"
    other_vms:
      hosts:
        vultr:
          ansible_user: yla
          ansible_port: 2222
    proxmox:
      hosts:
        homelab1:
          ansible_user: root
        homelab2:
          ansible_user: root
        homelab3:
          ansible_user: root
    vms_on_proxmox:
      hosts:
        grafana:
          ansible_user: ubuntu
        influx:
          ansible_user: ubuntu
        playground-bravo:
          ansible_user: ubuntu
        ubuntu-alpha:
          ansible_user: ubuntu
        umami:
          ansible_user: ubuntu
          compose_dirs:
            - "/home/ubuntu"
        vicky:
          ansible_user: ubuntu
        yankee:
          ansible_user: ubuntu
        immich:
          ansible_user: ubuntu
          compose_dirs:
            - "/home/ubuntu/immich-app"
        dokku1:
          ansible_user: ubuntu
        waung:
          ansible_user: ubuntu
        navidrome:
          ansible_user: ubuntu
          compose_dirs:
            - "/home/ubuntu/navidrome"
            - "/home/ubuntu/lidarr"
        clickstack:
          ansible_user: ubuntu
        sportzx:
          ansible_host: 192.168.1.110
          ansible_user: ubuntu
        wazuh:
          ansible_host: 192.168.1.81
          ansible_user: ubuntu
        semaphore:
          ansible_host: 192.168.1.79
          ansible_user: ubuntu
          compose_dirs:
            - "/home/ubuntu/semaphore"
        # yla-jp-1:
        #   ansible_user: ubuntu
        # yla-jp-2:
        #   ansible_user: ubuntu
        cloud-gateway-fiber:
          ansible_user: root
    # Hosts whose OS packages are managed elsewhere. apt_update_upgrade and
    # apt_dist_upgrade skip them even when vm_hosts names them directly.
    no_os_upgrades:
      hosts:
        # UniFi OS: Ubiquiti manages its packages, and apt upgrade fails on
        # its half-configured miniupnpd and wireshark packages.
        cloud-gateway-fiber:
